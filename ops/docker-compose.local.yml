services:
  openclaw-crypto-worker:
    build:
      context: ..
      dockerfile: ops/Dockerfile
    image: openclaw-crypto-worker:local
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    environment:
      NODE_ENV: production
      OPENCLAW_CRYPTO_WORKER_HOME: /var/lib/openclaw-crypto-worker
      OPENCLAW_CRYPTO_WORKER_HOST: 0.0.0.0
      OPENCLAW_CRYPTO_WORKER_PORT: 3777
      OPENCLAW_CRYPTO_WORKER_MODE: dry-run
      BASE_RPC_URL_FILE: /run/secrets/base_rpc_url
      CRYPTO_WORKER_TOKEN_FILE: /run/secrets/crypto_worker_token
      BURNER_WALLET_ADDRESS_FILE: /run/secrets/burner_wallet_address
    volumes:
      - ./local-state:/var/lib/openclaw-crypto-worker
    ports:
      - "127.0.0.1:3777:3777"
    secrets:
      - base_rpc_url
      - crypto_worker_token
      - burner_wallet_address

secrets:
  base_rpc_url:
    file: ./local-secrets/base_rpc_url.txt
  crypto_worker_token:
    file: ./local-secrets/crypto_worker_token.txt
  burner_wallet_address:
    file: ./local-secrets/burner_wallet_address.txt

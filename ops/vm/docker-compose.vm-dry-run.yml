services:
  openclaw-crypto-worker:
    build:
      context: ../..
      dockerfile: ops/Dockerfile
    image: openclaw-crypto-worker:vm-dry-run
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 1
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    environment:
      NODE_ENV: production
      OPENCLAW_CRYPTO_WORKER_HOME: /var/lib/openclaw-crypto-worker
      OPENCLAW_CRYPTO_WORKER_HOST: 0.0.0.0
      OPENCLAW_CRYPTO_WORKER_PORT: 3777
      OPENCLAW_CRYPTO_WORKER_MODE: dry-run
      BASE_RPC_URL_FILE: /run/app-secrets/base_rpc_url.txt
      CRYPTO_WORKER_TOKEN_FILE: /run/app-secrets/crypto_worker_token.txt
      BURNER_WALLET_ADDRESS_FILE: /run/app-secrets/burner_wallet_address.txt
    volumes:
      - ./runtime-state:/var/lib/openclaw-crypto-worker
      - ./runtime-secrets:/run/app-secrets:ro
    ports:
      - "${OPENCLAW_CRYPTO_VM_TAILSCALE_IP}:3777:3777"
